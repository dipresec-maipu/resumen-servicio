<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Resumen de Servicio DIPRESEC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Resumen de Servicio DIPRESEC</h1>
      <p>Registro rápido de ítems y generación de resumen consolidado para correo y WhatsApp.</p>
    </div>
  </header>

  <main class="layout">
    <section class="card config-card">
      <h2>Configuración</h2>
      <label>URL Web App de Apps Script
        <input id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/AKfycbyCpDXuSviRGT6nZlxYM_jD9jfGrqjBVDKceZOQye4DTOHVU_1EzJ_ivdCs5PNKVLQj/exec" />
      </label>
      <label>Token
        <input id="apiToken" type="password" placeholder="Misma clave configurada en Code.gs" />
      </label>
      <button id="btnSaveConfig" class="secondary">Guardar configuración</button>
    </section>

    <section class="card turno-card">
      <h2>Datos del turno</h2>
      <div class="grid-3">
        <label>Fecha
          <input id="fecha" type="date" />
        </label>
        <label>Turno
          <select id="turno">
            <option value="1° turno">1° turno</option>
            <option value="2° turno">2° turno</option>
            <option value="3° turno">3° turno</option>
          </select>
        </label>
        <label>Encargado/a
          <input id="encargado" type="text" placeholder="Nombre encargado/a" />
        </label>
      </div>
      <div class="actions">
        <button id="btnCargar">Cargar registros del turno</button>
        <button id="btnGenerar" class="primary">Generar resumen</button>
      </div>
    </section>

    <section class="card form-card">
      <h2>Agregar ítem al resumen</h2>
      <div class="grid-3">
        <label>Tipo de registro
          <select id="tipo_registro"></select>
        </label>
        <label>Funcionario/a municipal
          <input id="funcionario" type="text" placeholder="Nombre funcionario/a" />
        </label>
        <label>Móvil
          <input id="movil" type="text" placeholder="TSRL-18 / IMAN-98 / Maipú 43" />
        </label>
        <label>Cuadrante
          <select id="cuadrante"></select>
        </label>
        <label>Lugar / servicio
          <input id="lugar" type="text" placeholder="Colegio, feria, sector, punto fijo" />
        </label>
        <label>Dirección
          <input id="direccion" type="text" placeholder="Dirección o intersección" />
        </label>
        <label>Modalidad
          <select id="modalidad"></select>
        </label>
        <label>Horario inicio
          <input id="horario_inicio" type="time" />
        </label>
        <label>Horario término
          <input id="horario_termino" type="time" />
        </label>
        <label>Comisaría
          <select id="comisaria"></select>
        </label>
        <label>Funcionario/a Carabineros
          <input id="funcionario_carabineros" type="text" placeholder="Grado y nombre, si aplica" />
        </label>
        <label>Tipo de novedad
          <select id="tipo_novedad"></select>
        </label>
        <label>Orden
          <input id="orden" type="number" min="1" step="1" placeholder="1" />
        </label>
      </div>
      <label>Observación
        <textarea id="observacion" rows="3" maxlength="1200" placeholder="Detalle breve del servicio, motivo o novedad"></textarea>
      </label>
      <div class="actions">
        <button id="btnGuardar" class="primary">Guardar ítem</button>
        <button id="btnLimpiar" class="secondary" type="button">Limpiar formulario</button>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section class="card registros-card">
      <div class="section-head">
        <h2>Registros del turno</h2>
        <span id="contador">0 registros</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tipo</th>
              <th>Funcionario</th>
              <th>Móvil</th>
              <th>Cuadrante</th>
              <th>Lugar</th>
              <th>Observación</th>
            </tr>
          </thead>
          <tbody id="tbodyRegistros"></tbody>
        </table>
      </div>
    </section>

    <section class="card resumen-card">
      <div class="section-head">
        <h2>Resumen consolidado</h2>
        <div class="actions compact">
          <button id="btnCopiar" class="secondary">Copiar texto</button>
          <button id="btnWhatsapp" class="success">Abrir WhatsApp</button>
          <button id="btnOutlook" class="secondary">Abrir Outlook</button>
        </div>
      </div>
      <textarea id="resumen" rows="18" placeholder="Aquí aparecerá el resumen consolidado..."></textarea>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
